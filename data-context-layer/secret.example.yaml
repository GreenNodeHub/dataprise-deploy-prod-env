# Not part of the chart — copy, fill in, and apply BEFORE syncing the releases:
#   kubectl -n stg-genai-platform apply -f <filled-in copy>
# The API and the worker read the same credentials but reference separate Secret
# names (values.yaml existingSecret vs values-worker.yaml existingSecret).
apiVersion: v1
kind: Secret
metadata:
  name: data-context-layer-env
  namespace: stg-genai-platform
type: Opaque
stringData:
  # Kyuubi/Spark JDBC endpoint, e.g.
  # jdbc:kyuubi://kyuubi.<ns>.svc.cluster.local:10009/;#kyuubi.engine.type=SPARK_SQL
  CUBEJS_JDBC_URL: ""
  CUBEJS_DB_USER: ""
  CUBEJS_DB_PASS: ""
  # Signs the JWTs Cube accepts on the REST/SQL API. Generate once, keep stable —
  # rotating it invalidates every issued token.
  CUBEJS_API_SECRET: ""
  # Dataprise credential store, same values as the genai-mcp-server release:
  # Postgres DSN plus the key that encrypts the credentials held in it. Cube
  # resolves per-datasource credentials through these, so both processes need
  # network reach to that Postgres or they exit at startup.
  DATAPRISE_CREDENTIALS_DATABASE_URL: ""
  DATAPRISE_CREDENTIALS_MASTER_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: data-context-layer-worker-env
  namespace: stg-genai-platform
type: Opaque
stringData:
  CUBEJS_JDBC_URL: ""
  CUBEJS_DB_USER: ""
  CUBEJS_DB_PASS: ""
  CUBEJS_API_SECRET: ""
  DATAPRISE_CREDENTIALS_DATABASE_URL: ""
  DATAPRISE_CREDENTIALS_MASTER_KEY: ""
