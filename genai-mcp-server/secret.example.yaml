# Not part of the chart — copy, fill in, and apply BEFORE syncing the release:
#   cp secret.example.yaml /tmp/s.yaml && $EDITOR /tmp/s.yaml
#   kubectl -n stg-genai-platform apply -f /tmp/s.yaml
# Names must match values.yaml: existingSecret / existingSecretFile.
apiVersion: v1
kind: Secret
metadata:
  name: genai-mcp-server-env
  namespace: stg-genai-platform
type: Opaque
stringData:
  # Microsoft Entra ID app registration (public client, PKCE, no client secret).
  MS_TENANT_ID: ""
  MS_CLIENT_ID: ""
  # Optional; defaults to {BASE_URI}/auth/microsoft/callback.
  MS_REDIRECT_URI: ""
  # Optional; Application ID URI of the MCP API app reg, enables the OBO flow.
  # MS_MCP_AUDIENCE: "api://<mcp-api-app-id>"

  # Session store. Without it sessions are in-memory and lost on restart, and
  # NODE_ENV=production makes the process exit if this URL cannot be reached.
  REDIS_URL: "redis://redis.stg-genai-platform.svc.cluster.local:6379"
  REDIS_TLS: "0"

  # Only read when AUTH_MODE=external (values.yaml sets internal).
  # AUTH_SERVER_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: genai-mcp-server-file
  namespace: stg-genai-platform
type: Opaque
stringData:
  # Mounted at /opt/app-root/datasources.json (see DATASOURCES_CONFIG).
  # Shape mirrors datasources.example.json in the service repo.
  datasources.json: |
    {
      "datasources": []
    }
