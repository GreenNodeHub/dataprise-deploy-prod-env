# Defaults target stg-genai-platform. Per-environment overrides come from the
# ArgoCD Application (spec.source.helm.parameters), not from this file.
#
# Secrets are NOT in this chart. Fill in secret.example.yaml and apply it to the
# namespace first; the names below are how the workload picks it up.

# Object name for every resource. Leave empty to fall back to the chart name.
appname: ""
namespace: stg-genai-platform

replicaCount: 1

image:
  registry: vcr.vngcloud.vn
  repository: 60108-backend-worker/portal-external/stg/genai-mcp-server
  tag: "6280ea3-stg-data-mcp-tools-40"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: image-pull-secret-genai

imagePullSecretContent: ""
# Secret holding MS_TENANT_ID / MS_CLIENT_ID / REDIS_URL / ... injected via envFrom.
# Must already exist in the namespace (see secret.example.yaml).
existingSecret: genai-mcp-server-env
# Secret mounted as files (datasources.json). Empty disables the mount.
existingSecretFile: genai-mcp-server-file
# Base64-encoded file contents, filled from the ArgoCD Application.
# Empty = manage the Secret by hand.
fileSecretContent: {}
secretFileMountPath: /opt/app-root/

# Non-secret config, plain env vars.
env:
  - name: TZ
    value: Asia/Ho_Chi_Minh
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3232"
  - name: BASE_URI
    value: https://data-mcp.greennode.vn
  - name: AUTH_MODE
    value: internal
  - name: DATASOURCES_CONFIG
    value: /opt/app-root/datasources.json
  # Exactly one nginx ingress hop sits in front, so client IPs for rate limiting
  # are read from the last X-Forwarded-For entry.
  - name: TRUST_PROXY
    value: "1"

extraEnvFrom: []

service:
  type: NodePort
  port: 3232
  annotations: {}

# Additional Services on other container ports (none for this app).
extraServices: []

resources:
  requests:
    cpu: 500m
    memory: 500Mi
  limits:
    cpu: "1"
    memory: 2Gi

# The splash page at / confirms the HTTP server is live (same check as the
# Dockerfile HEALTHCHECK).
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe: {}

# Long grace period: in-flight MCP sessions are long-lived streams.
terminationGracePeriodSeconds: 300

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automount: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# The image already runs as the unprivileged 'node' user.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

command: []
args: []

volumes: []
volumeMounts: []

vpa:
  enabled: false
  # updateMode: ["Auto","Recreate","Initial","Off"]
  updateMode: Recreate
  minAllowed:
    cpu: 500m
    memory: 500Mi
  maxAllowed:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
hostAliases: []

# In-cluster Redis for the session store. Ephemeral, no persistence; fine for
# stg. Set enabled=false and point REDIS_URL elsewhere for prod.
redis:
  enabled: false
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi