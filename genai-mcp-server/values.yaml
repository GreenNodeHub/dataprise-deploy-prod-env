# Defaults target stg-genai-platform. Per-environment overrides come from the
# ArgoCD Application (spec.source.helm.parameters), not from this file.
#
# Secrets are NOT in this chart. Fill in secret.example.yaml and apply it to the
# namespace first; the names below are how the workload picks it up.

# Object name for every resource. Leave empty to fall back to the chart name.
appname: ""
namespace: stg-genai-platform

replicaCount: 1

image:
  registry: vcr.vngcloud.vn
  repository: 60108-backend-worker/portal-external/stg/genai-mcp-server
  tag: "ba3c937-stg-observability-tracing-67"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: image-pull-secret-genai

imagePullSecretContent: ""
# Secret holding MS_TENANT_ID / MS_CLIENT_ID / REDIS_URL /
# DATAPRISE_CREDENTIALS_* / ... injected via envFrom. Either apply it by hand
# (see secret.example.yaml) or let envSecretContent below create it.
existingSecret: genai-mcp-server-env
# Key/values for the env Secret above, filled from the ArgoCD Application.
# Values stay empty here on purpose -- this file is tracked in git.
# NOTE: a non-empty map makes the chart own genai-mcp-server-env, so EVERY key
# the workload needs must be listed here, not only the ones below.
envSecretContent:
  DATAPRISE_CREDENTIALS_DATABASE_URL: ""
  DATAPRISE_CREDENTIALS_MASTER_KEY: ""
  # OpenSearch monitoring (opt-in: empty URL leaves it off). No user:pass@ in
  # the URL -- credentials go in the two keys below it.
  OPENSEARCH_MONITORING_URL: ""
  OPENSEARCH_MONITORING_USERNAME: ""
  OPENSEARCH_MONITORING_PASSWORD: ""
  # OTLP collector auth for tracing (see OTEL_* in env below).
  OTEL_EXPORTER_OTLP_HEADERS: ""
# Secret mounted as files (datasources.json). Empty disables the mount.
existingSecretFile: genai-mcp-server-file
# Base64-encoded file contents, filled from the ArgoCD Application.
# Empty = manage the Secret by hand.
fileSecretContent: {}
secretFileMountPath: /opt/app-root/

# Non-secret config, plain env vars.
env:
  - name: TZ
    value: Asia/Ho_Chi_Minh
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3232"
  - name: BASE_URI
    value: https://data-mcp.greennode.vn
  - name: AUTH_MODE
    value: internal
  - name: DATASOURCES_CONFIG
    value: /opt/app-root/datasources.json
  # Exactly one nginx ingress hop sits in front, so client IPs for rate limiting
  # are read from the last X-Forwarded-For entry.
  - name: TRUST_PROXY
    value: "1"
  # Tracing, opt-in: an empty endpoint leaves it off. OTEL_SERVICE_NAME is also
  # the service name stamped on OpenSearch events.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: ""
  - name: OTEL_SERVICE_NAME
    value: genai-mcp-server

extraEnvFrom: []

service:
  type: NodePort
  port: 3232
  annotations: {}

# Additional Services on other container ports (none for this app).
extraServices: []

ingress:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 500Mi
  limits:
    cpu: "1"
    memory: 2Gi

# The splash page at / confirms the HTTP server is live (same check as the
# Dockerfile HEALTHCHECK).
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe: {}

# Long grace period: in-flight MCP sessions are long-lived streams.
terminationGracePeriodSeconds: 300

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automount: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# The image already runs as the unprivileged 'node' user.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

command: []
args: []

volumes: []
volumeMounts: []

vpa:
  enabled: false
  # updateMode: ["Auto","Recreate","Initial","Off"]
  updateMode: Recreate
  minAllowed:
    cpu: 500m
    memory: 500Mi
  maxAllowed:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
hostAliases: []

# In-cluster Redis for the session store. Ephemeral, no persistence; fine for
# stg. Set enabled=false and point REDIS_URL elsewhere for prod.
redis:
  enabled: false
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi